name: Lighthouse

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev, main]  # Also run on push to verify; continue-on-error prevents blocking

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't block PR - Lighthouse is flaky in CI (CHROME_INTERSTITIAL_ERROR)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.investlink.ai
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-XXXXXXXXXX
        run: npm run build

      - name: Start server
        run: npm run start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 -t 60000

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: .github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
